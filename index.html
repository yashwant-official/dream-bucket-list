<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dream Bucket List</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="hero"><div class="container"><h1>✨ Dream Bucket List</h1><p>Dream big. Plan your goals. Make them happen.</p><a href="#dream-form" class="button">Add Your First Dream</a></div></header>
  <main class="container">
    <section aria-label="Progress dashboard" class="dashboard">
      <div class="stat"><span>Total dreams</span><strong id="total-count">0</strong></div>
      <div class="stat"><span>Completed</span><strong id="completed-count">0</strong></div>
      <div class="stat"><span>Pending</span><strong id="pending-count">0</strong></div>
      <div class="stat"><span>Progress</span><strong id="progress-percent">0%</strong></div>
    </section>
    <div class="progress-track" role="progressbar" aria-label="Dream completion" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="progress-track"><div id="progress-fill"></div></div>
    <section class="panel" aria-labelledby="form-heading"><h2 id="form-heading">Add a Dream</h2>
      <form id="dream-form">
        <label>Dream name <input id="dream-name" type="text" maxlength="100" required placeholder="e.g. Learn Java"></label>
        <label>Category <select id="dream-category" required><option value="">Choose a category</option><option>Travel</option><option>Education</option><option>Career</option><option>Personal Development</option><option>Fitness</option><option>Adventure</option><option>Lifestyle</option><option>Others</option></select></label>
        <label>Description <textarea id="dream-description" rows="3" required maxlength="500" placeholder="Describe your goal"></textarea></label>
        <label>Target date (optional) <input id="dream-date" type="date"></label>
        <label>Priority <select id="dream-priority"><option>Medium</option><option>High</option><option>Low</option></select></label>
        <div class="actions"><button id="save-button" type="submit">Add Dream</button><button type="button" id="cancel-edit" class="secondary" hidden>Cancel Edit</button></div>
        <p id="form-message" role="status" aria-live="polite"></p>
      </form>
    </section>
    <section class="panel" aria-labelledby="list-heading"><div class="list-heading"><h2 id="list-heading">My Dreams</h2><label>Show <select id="status-filter"><option value="all">All dreams</option><option value="pending">Pending</option><option value="completed">Completed</option></select></label></div><div id="dream-list" class="dream-grid"></div></section>
  </main>
  <footer>Made with ❤️ by our two-member team</footer>
  <script src="data.js"></script><script src="dreams.js"></script><script src="dashboard.js"></script><script src="script.js"></script>
</body>
</html>
